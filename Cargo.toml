[package]
name = "tless"
version = "0.1.0"
edition = "2024"
authors = ["gdhvxcj <wangnan5117@gmail.com>"]

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 0 # Optimization level: 0-3, "s" (size), "z" (extra size)
lto = true    # Link-Time Optimization (true/false/"thin") for cross-crate optimization
strip = true  # Automatically strip symbols and debug info (true/"debuginfo"/"symbols")
debug = false # Exclude debug symbols entirely

[profile.release]
opt-level = 3     # Optimization level: 0-3, "s" (size), "z" (extra size)
lto = true        # Link-Time Optimization (true/false/"thin") for cross-crate optimization
codegen-units = 1 # Reduce parallel compilation blocks to 1 for better optimizations
strip = true      # Automatically strip symbols and debug info (true/"debuginfo"/"symbols")
debug = false     # Exclude debug symbols entirely

[dependencies]
actix-web = "4"
arc-swap = "1.7.1"
chrono = "0.4.41"
chrono-tz = "0.10.4"
clap = { version = "4.5.46", features = ["derive"] }
notify-debouncer-full = "0.7.0"
frontmatter-gen = "0.0.5"
notify = { version = "8.2.0", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml = "0.9.34"
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros"] }
toml = "1.0.6"
tera = "1.20.0"
sha2 = "0.10.9"
pulldown-cmark = "0.13.0"
futures = "0.3.31"
num_cpus = "1.17.0"
serde_json = "1.0.145"
ring = "0.17.14"
data-encoding = "2.9.0"
rhai = { version = "1.23.4", features = ["metadata", "sync"] }
anyhow = "1.0.100"
env_logger = "0.11.9"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing = "0.1.44"
