name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Publish crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check secret presence
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is empty"
            exit 1
          fi
          echo "Token present, length: ${#TOKEN}"

      - name: Create release
        id: create
        uses: seaofvoices/rust-release-action@v1
        with:
          publish_crate: true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    outputs:
      upload_url: ${{ steps.create.outputs.upload_url }}
      build_matrix: ${{ steps.create.outputs.build_matrix }}

  build-artifacts:
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.create-release.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cargo_target }}

      - name: Build and upload artifact
        uses: seaofvoices/build-rust-artifact-action@v1
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
