name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Publish crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create release
        id: create
        uses: seaofvoices/rust-release-action@v1
        with:
          publish_crate: true
          cargo_token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          github_token: ${{ secrets.RELEASE_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    outputs:
      upload_url: ${{ steps.create.outputs.upload_url }}
      build_matrix: ${{ steps.create.outputs.build_matrix }}

  build-artifacts:
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: tles-windows-x86_64
            cargo_target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            artifact_name: tles-linux-x86_64
            cargo_target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            artifact_name: tles-linux-aarch64
            cargo_target: aarch64-unknown-linux-gnu
            linker: gcc-aarch64-linux-gnu
          - os: macos-latest
            artifact_name: tles-macos-x86_64
            cargo_target: x86_64-apple-darwin
          - os: macos-latest
            artifact_name: tles-macos-aarch64
            cargo_target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cargo_target }}

      - name: Build and upload artifact
        uses: seaofvoices/build-rust-artifact-action@v1
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
