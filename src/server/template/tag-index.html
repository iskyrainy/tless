{% extends "base.html" %}
{% block main %}
<div class="page">
    <h1 class="page-title">Tags</h1>
    <p class="archive-count">{{ site.tag | length }} tags across all posts</p>
    <div class="taxonomy-list">
        {{ list_tag(orderby="name", order=1, list=true, show_count=true) | safe }}
    </div>
</div>
{% endblock main %}
