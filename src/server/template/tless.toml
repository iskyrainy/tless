# Tless configuration
# Update these values for your own site before publishing.
[site]
title = "My Tless Site"
subtitle = "hello"
description = "A fast blog powered by Tless."
rights = "All rights reserved Tless"
author = "Tless"
url = "http://127.0.0.1:8917"
zone = "Asia/Shanghai"
theme = "base"
favicon = ""
menu = [
    { name = "Home", link = "/index.html" },
    { name = "Tags", link = "/tag" },
    { name = "Categories", link = "/category" },
]

[i18n]
provider = "deepseek"
api_key = ""
model = "deepseek-flash"
target_lang = ["zh-CN", "en", "jp", "ko"]

# Post comments via giscus (https://giscus.app). Copy the ids from the site's
# configuration box into your repository's Discussions setup. Comments stay
# hidden while `repo` is empty.
[giscus]
repo = ""
repo_id = ""
category = "Announcements"
category_id = ""
mapping = "pathname"
lang = "en"
